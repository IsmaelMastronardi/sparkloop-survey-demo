<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survey demo</title>
  <style>
    :root {
      --bg: #f5f3ff;
      --card: #ffffff;
      --ink: #1f1b3a;
      --muted: #6b6785;
      --line: #e4e0f5;
      --brand: #5b3df5;
      --brand-soft: #efeaff;
      --error: #c2283b;
      --ok: #157f4b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    .page { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: 0 8px 30px rgba(43, 25, 120, .06); }
    h1 { font-size: 28px; line-height: 1.2; margin: 8px 0 8px; }
    .subheader { color: var(--muted); margin: 0 0 24px; }
    .field { margin-bottom: 22px; }
    .field[hidden] { display: none; }
    .label { display: block; font-weight: 600; margin-bottom: 8px; }
    .required { color: var(--brand); margin-left: 2px; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="url"] {
      width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; color: var(--ink); background: #fff;
    }
    input:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
    .options { display: flex; flex-wrap: wrap; gap: 8px; }
    .option {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid var(--line);
      border-radius: 999px; cursor: pointer; font-size: 14px; background: #fff; user-select: none;
    }
    .option input { margin: 0; accent-color: var(--brand); }
    .option:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .checkbox-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .checkbox-row input { width: 18px; height: 18px; accent-color: var(--brand); }
    .promotion {
      display: block; border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; background: #fff;
    }
    .promotion:has(input:checked) { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .promotion .overline { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); }
    .promotion .title-row { display: flex; align-items: center; gap: 10px; margin: 8px 0 6px; }
    .promotion img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); }
    .promotion .title { font-weight: 700; }
    .promotion .description { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
    .promotion .action { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
    .promotion .action input { width: 18px; height: 18px; accent-color: var(--brand); }
    .error { color: var(--error); font-size: 13px; margin-top: 6px; }
    .field.has-error input[type="text"], .field.has-error input[type="email"], .field.has-error input[type="tel"] { border-color: var(--error); }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 8px; }
    button {
      background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 13px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button[disabled] { opacity: .6; cursor: default; }
    .secondary { background: #fff; color: var(--error); border: 1px solid #f3c2ca; }
    .demo-tools { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
    .demo-tools p { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
    .skip { color: var(--muted); font-size: 14px; text-decoration: underline; cursor: pointer; background: none; border: 0; padding: 0; }
    .terms { font-size: 12px; color: var(--muted); margin-top: 16px; }
    .banner { border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; font-size: 14px; }
    .banner.error { background: #fdecef; color: var(--error); }
    .banner.ok { background: #e6f6ee; color: var(--ok); }
    .banner.info { background: var(--brand-soft); color: var(--brand); }
    .status { text-align: center; color: var(--muted); padding: 40px 0; }
    .log { margin-top: 28px; }
    .log h2 { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
    .log pre { background: #17142b; color: #e9e6ff; padding: 14px; border-radius: 10px; font-size: 12px; overflow: auto; max-height: 520px; margin: 0; white-space: pre-wrap; word-break: break-word; }
    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">Survey demo</div>
    <div id="app" class="panel">
      <div class="status">Loading the survey…</div>
    </div>
    <section class="log">
      <h2>API calls and responses</h2>
      <pre id="log">No calls yet.</pre>
    </section>
  </main>

  <script>
    // --- SparkLoop config ------------------------------------------------------
    // Client mode: SparkLoop never renders its own widget, this page owns the UI.
    // Test mode stays on while building, so nothing is recorded as real traffic.
    // Turn it off only once SparkLoop has reviewed and activated the integration.
    const publicationUuid = "pub_6aa6c1374096";
    const surveyUuid = "survey_a800a880e760";
    const testMode = new URLSearchParams(location.search).get("test_mode") !== "false";

    window.SL = { mode: "client", test_mode: testMode };

    // The embed fires sl:ready on document once SL.client is usable. Listen right away so
    // the event can't fire before we're listening, and give up if it never comes.
    const sparkloopReady = new Promise((resolve, reject) => {
      document.addEventListener("sl:ready", () => resolve(window.SL.client), { once: true });
      setTimeout(() => reject(Object.assign(
        new Error("The SparkLoop script didn't load. Check the publication ID and that this host is allowed."),
        { code: "not_ready", details: [] },
      )), 15000);
    });

    const embed = document.createElement("script");
    embed.async = true;
    embed.src = `https://js.sparkloop.app/embed.js?publication_id=${encodeURIComponent(publicationUuid)}`;
    embed.setAttribute("data-sparkloop", "");
    document.head.appendChild(embed);
  </script>

  <script>
    // --- Data source ----------------------------------------------------------
    // Backed by SL.client.surveys. fetchSurvey resolves with a survey object
    // ({ uuid, header, subheader, button_label, skip_link, custom_terms, items }), and
    // submitSurvey resolves on success or rejects with a ClientApiError carrying
    // { code, message, status, details }.

    async function fetchSurvey({ uuid }) {
      const client = await sparkloopReady;
      return client.surveys.fetch({ uuid });
    }

    async function submitSurvey({ uuid, email, answers, promotionUuids }) {
      const client = await sparkloopReady;
      return client.surveys.submit({ uuid, email, answers, promotionUuids });
    }
    const app = document.getElementById("app");
    const logEl = document.getElementById("log");
    let survey = null;

    let logStarted = false;
    function log(label, data) {
      if (!logStarted) { logEl.textContent = ""; logStarted = true; }
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${label}\n${JSON.stringify(data, null, 2)}\n\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function el(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(attrs).forEach(([ key, value ]) => {
        if (value === undefined || value === null || value === false) return;
        if (key === "text") node.textContent = value;
        else if (key === "className") node.className = value;
        else node.setAttribute(key, value === true ? "" : value);
      });
      [].concat(children).forEach((child) => child && node.appendChild(child));
      return node;
    }

    // --- Rendering -----------------------------------------------------------

    function renderQuestion(question) {
      const field = el("div", { className: "field", "data-uuid": question.uuid, "data-kind": "question" });
      const name = `q_${question.uuid}`;

      if (question.input_type === "checkbox") {
        field.appendChild(el("label", { className: "checkbox-row" }, [
          el("input", { type: "checkbox", name }),
          el("span", { text: question.label }),
          question.required ? el("span", { className: "required", text: "*" }) : null,
        ]));
      } else {
        field.appendChild(el("label", { className: "label", for: name }, [
          document.createTextNode(question.label),
          question.required ? el("span", { className: "required", text: "*" }) : null,
        ]));

        if (question.input_type === "text_input") {
          field.appendChild(el("input", {
            type: question.html_type || "text",
            id: name,
            name,
            autocomplete: question.autocomplete || "off",
          }));
        } else {
          const multi = question.input_type === "multi_select";
          const options = el("div", { className: "options" });
          question.options.forEach((option) => {
            options.appendChild(el("label", { className: "option" }, [
              el("input", { type: multi ? "checkbox" : "radio", name, value: option }),
              el("span", { text: option }),
            ]));
          });
          field.appendChild(options);
          if (multi && question.max_selections) {
            field.appendChild(el("div", { className: "hint", text: `Pick up to ${question.max_selections}.` }));
          }
        }
      }

      field.appendChild(el("div", { className: "error", hidden: true }));
      return field;
    }

    function renderPromotion(promotion) {
      const isOffer = promotion.kind === "offer";
      const data = isOffer ? promotion.offer : promotion.recommendation;
      const field = el("div", { className: "field", "data-uuid": promotion.uuid, "data-kind": "promotion" });

      field.appendChild(el("label", { className: "promotion" }, [
        el("div", { className: "overline", text: isOffer ? "Exclusive welcome perk" : "Our readers also love" }),
        el("div", { className: "title-row" }, [
          (isOffer ? data.brand_logo : data.logo) ? el("img", { src: isOffer ? data.brand_logo : data.logo, alt: "" }) : null,
          el("div", { className: "title", text: isOffer ? data.headline : data.name }),
        ]),
        el("p", { className: "description", text: data.description || "" }),
        el("div", { className: "action" }, [
          el("input", { type: "checkbox", name: `p_${promotion.uuid}` }),
          el("span", { text: isOffer ? (data.call_to_action || "Yes, I want it") : "Claim free access" }),
        ]),
      ]));
      return field;
    }

    function renderSurvey() {
      app.innerHTML = "";
      const form = el("form", { novalidate: true });

      form.appendChild(el("div", { id: "banner" }));
      form.appendChild(el("h1", { text: survey.header }));
      form.appendChild(el("p", { className: "subheader", text: survey.subheader }));

      const emailField = el("div", { className: "field", "data-kind": "email" }, [
        el("label", { className: "label", for: "email" }, [ document.createTextNode("Email"), el("span", { className: "required", text: "*" }) ]),
        el("input", { type: "email", id: "email", name: "email", autocomplete: "email", placeholder: "you@example.com" }),
      ]);
      form.appendChild(emailField);

      survey.items.forEach((item) => {
        form.appendChild(item.type === "question" ? renderQuestion(item) : renderPromotion(item));
      });

      form.appendChild(el("div", { className: "actions" }, [
        el("button", { type: "submit", text: survey.button_label }),
        el("button", { type: "button", className: "skip", text: survey.skip_link }),
      ]));

      form.appendChild(el("div", { className: "demo-tools" }, [
        el("button", { type: "button", className: "secondary invalid", text: "Send a submission with errors" }),
        el("p", { text: "Demo only: sends a payload built to break every rule the survey has, and shows the errors the API returns." }),
      ]));

      if (survey.custom_terms?.enabled && survey.custom_terms.text) {
        const terms = el("p", { className: "terms" });
        terms.appendChild(survey.custom_terms.url
          ? el("a", { href: survey.custom_terms.url, target: "_blank", rel: "noopener", text: survey.custom_terms.text })
          : document.createTextNode(survey.custom_terms.text));
        form.appendChild(terms);
      }

      form.addEventListener("change", applyConditions);
      form.addEventListener("input", applyConditions);
      form.addEventListener("submit", onSubmit);
      form.querySelector(".invalid").addEventListener("click", onInvalidSubmit);
      form.querySelector(".skip").addEventListener("click", () => showBanner("info", "Skipped. Nothing was submitted."));

      app.appendChild(form);
      applyConditions();
    }

    // --- Answers and conditions ---------------------------------------------

    function questionValue(question) {
      const name = `q_${question.uuid}`;
      if (question.input_type === "checkbox") {
        return app.querySelector(`input[name="${name}"]`).checked ? "Yes" : null;
      }
      if (question.input_type === "text_input") {
        const value = app.querySelector(`input[name="${name}"]`).value.trim();
        return value === "" ? null : value;
      }
      const picked = [ ...app.querySelectorAll(`input[name="${name}"]:checked`) ].map((input) => input.value);
      if (question.input_type === "multi_select") return picked.length ? picked : null;
      return picked[0] || null;
    }

    function isVisible(item) {
      return !app.querySelector(`[data-uuid="${item.uuid}"]`).hidden;
    }

    // A condition is met when its (visible) trigger question has the given answer.
    function conditionMet(condition) {
      const trigger = survey.items.find((item) => item.uuid === condition.question_uuid);
      if (!trigger || !isVisible(trigger)) return false;

      const value = questionValue(trigger);
      if (Array.isArray(value)) return value.includes(condition.value);
      return value === condition.value;
    }

    // Once a multi_select question reaches max_selections, its unpicked options are disabled.
    function applySelectionLimits() {
      survey.items
        .filter((item) => item.input_type === "multi_select" && item.max_selections)
        .forEach((question) => {
          const inputs = [ ...app.querySelectorAll(`input[name="q_${question.uuid}"]`) ];
          const full = inputs.filter((input) => input.checked).length >= question.max_selections;
          inputs.forEach((input) => { input.disabled = full && !input.checked; });
        });
    }

    function applyConditions() {
      applySelectionLimits();
      // Triggers always come before the items that depend on them, so one pass in order is enough.
      survey.items.forEach((item) => {
        const field = app.querySelector(`[data-uuid="${item.uuid}"]`);
        field.hidden = Boolean(item.condition) && !conditionMet(item.condition);
      });
    }

    // --- Submitting -----------------------------------------------------------

    function showBanner(type, text) {
      const banner = document.getElementById("banner");
      banner.className = `banner ${type}`;
      banner.textContent = text;
    }

    function clearErrors() {
      app.querySelectorAll(".field").forEach((field) => field.classList.remove("has-error"));
      app.querySelectorAll(".error").forEach((error) => { error.hidden = true; error.textContent = ""; });
      const banner = document.getElementById("banner");
      banner.className = "";
      banner.textContent = "";
    }

    function showQuestionError(questionUuid, message) {
      const field = app.querySelector(`[data-uuid="${questionUuid}"]`);
      if (!field) return;
      const label = survey.items.find((item) => item.uuid === questionUuid)?.label || "This question";
      field.classList.add("has-error");
      // A question can come back with several problems at once; list them all.
      const error = field.querySelector(".error");
      error.textContent = error.hidden ? `${label} ${message}` : `${error.textContent}; ${message}`;
      error.hidden = false;
    }

    async function onSubmit(event) {
      event.preventDefault();
      clearErrors();

      const button = app.querySelector("button[type=submit]");
      button.disabled = true;

      const email = app.querySelector("#email").value.trim();
      const answers = survey.items
        .filter((item) => item.type === "question" && isVisible(item))
        .map((question) => ({ question_uuid: question.uuid, value: questionValue(question) }))
        .filter((answer) => answer.value !== null);
      const promotionUuids = survey.items
        .filter((item) => item.type === "promotion" && isVisible(item))
        .filter((promotion) => app.querySelector(`input[name="p_${promotion.uuid}"]`).checked)
        .map((promotion) => promotion.uuid);

      await send({ uuid: surveyUuid, email, answers, promotionUuids }, button);
    }

    // A payload that breaks as many rules as this survey allows, so every kind of error comes back at once.
    function invalidAnswers() {
      const questions = survey.items.filter((item) => item.type === "question");
      const answers = [];
      const textQuestions = questions.filter((question) => question.input_type === "text_input" && !question.required);

      questions.forEach((question) => {
        if (question.condition) return;
        if (question.input_type === "multi_select") {
          // A repeated option, a made-up option, and more picks than allowed.
          const first = question.options[0];
          answers.push({ question_uuid: question.uuid, value: [ first, first, "not-an-option", ...question.options.slice(1) ] });
        } else if (question.input_type === "single_select") {
          answers.push({ question_uuid: question.uuid, value: "not-an-option" });
        } else if (question.input_type === "checkbox") {
          answers.push({ question_uuid: question.uuid, value: "No" });
        }
        // Required text questions are left out on purpose, so they come back blank.
      });

      // A list for a question that takes a single value, answered twice.
      if (textQuestions[0]) {
        answers.push({ question_uuid: textQuestions[0].uuid, value: [ "one", "two" ] });
        answers.push({ question_uuid: textQuestions[0].uuid, value: "again" });
      }

      // A question that doesn't exist in this survey.
      answers.push({ question_uuid: "survey_question_doesnotexist", value: "?" });
      return answers;
    }

    async function onInvalidSubmit(event) {
      clearErrors();
      const email = app.querySelector("#email").value.trim() || "invalid-demo@example.com";
      await send({ uuid: surveyUuid, email, answers: invalidAnswers(), promotionUuids: [] }, event.currentTarget);
    }

    async function send(payload, button) {
      button.disabled = true;
      log("submitSurvey(...)", payload);
      const { promotionUuids } = payload;

      try {
        const response = await submitSurvey(payload);
        log("→ resolved", response);
        app.innerHTML = "";
        app.appendChild(el("div", { className: "banner ok", text: "Thanks! Your answers were submitted." }));
        app.appendChild(el("p", { className: "subheader", text: promotionUuids.length
          ? `You claimed ${promotionUuids.length} promotion${promotionUuids.length === 1 ? "" : "s"}.`
          : "You didn't claim any promotions." }));

        // Lead offers and recommendations are fully claimed by submit. Click and action offers
        // only convert on the brand's page, so give the reader a link to finish there.
        survey.items
          .filter((item) => promotionUuids.includes(item.uuid) && item.kind === "offer" && item.offer.redirect_url)
          .forEach(({ offer }) => {
            app.appendChild(el("p", {}, [
              el("a", { href: offer.redirect_url, target: "_blank", rel: "noopener", text: `${offer.call_to_action || offer.headline} →` }),
            ]));
          });
      } catch (error) {
        log("→ rejected", { name: error.name, code: error.code, status: error.status, message: error.message, details: error.details });
        if (error.code === "invalid_answers") {
          const unknown = error.details.filter(({ question_uuid }) => !survey.items.some((item) => item.uuid === question_uuid));
          showBanner("error", `The API rejected ${error.details.length} answer${error.details.length === 1 ? "" : "s"}.` +
            (unknown.length ? ` Not in this survey: ${unknown.map(({ question_uuid, code, message }) => `${question_uuid} (${code}: ${message})`).join(", ")}.` : ""));
          error.details.forEach(({ question_uuid, code, message }) => showQuestionError(question_uuid, `${message} (${code})`));
        } else {
          showBanner("error", error.message);
        }
        button.disabled = false;
      }
    }

    // --- Boot -----------------------------------------------------------------

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        log("fetchSurvey(...)", { uuid: surveyUuid });
        survey = await fetchSurvey({ uuid: surveyUuid });
        log("→ resolved", survey);
        renderSurvey();
      } catch (error) {
        log("→ rejected", { name: error.name, code: error.code, status: error.status, message: error.message });
        app.innerHTML = "";
        app.appendChild(el("div", { className: "banner error", text: `Couldn't load the survey: ${error.message}` }));
      }
    });
  </script>
</body>
</html>
